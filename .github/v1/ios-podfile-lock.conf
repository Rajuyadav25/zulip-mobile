# Release Pipeline V1 lock portability config for ios/Podfile.lock (inspection-checklist §13A).
# Values trace to build-requirements.md §13 and proof-evidence/master-mission/A-baseline/
# (run 37597233209: installs from two absolute paths gave byte-identical locks;
# the committed lock was generated at RECORDED_ROOT on that runner).
# No entry is path-dependent, so there are no ENTRY lines: any lock change fails closed.
LOCK_FILE=ios/Podfile.lock
RECORDED_ROOT=/Users/runner/work/zulip-mobile/zulip-mobile
ENTRY_PATTERN=  {name}: ([0-9a-f]{40})
HASH_ALGORITHM=sha1
