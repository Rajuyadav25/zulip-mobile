# Release Pipeline V1
# PR Verification Workflow Template
#
# Instantiate repository-specific values and optional blocks from
# build-requirements.md before installing this workflow.
#
# Do not guess package managers, commands, checks, or cache behavior.
# Remove checks that inspection establishes are not applicable.

name: PR Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'

      - name: Set up Yarn classic
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Lint
        run: tools/test --all lint

      - name: Type check (Flow)
        run: tools/test --all flow

      - name: Format check (prettier-eslint)
        run: tools/test --all prettier

      # --all runs the Jest ios and android projects (build-requirements.md §5).
      - name: Test
        run: tools/test --all jest
